<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>B3 real-browser DOMPurify check</title></head>
<body>
<div id="out"></div>
<div id="host"></div>
<div id="extraOut"></div>
<script src="purify.js"></script>
<script>
const PURIFY_CONFIG = {
  ALLOWED_TAGS: [
    'div', 'span', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
    'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tr', 'th', 'td',
    'strong', 'em', 'b', 'i', 'br', 'hr', 'small',
    'svg', 'path', 'circle', 'rect', 'line', 'polyline', 'polygon', 'text', 'tspan',
  ],
  ALLOWED_ATTR: [
    'class', 'style', 'title', 'aria-label',
    'viewBox', 'fill', 'stroke', 'stroke-width',
    'd', 'cx', 'cy', 'r', 'x', 'y', 'width', 'height', 'points',
    'xmlns',
  ],
  FORBID_TAGS: ['button', 'input', 'form', 'select', 'textarea', 'script', 'iframe', 'object', 'embed'],
  ALLOW_DATA_ATTR: false,
  FORCE_BODY: true,
};
const UNSAFE_STYLE_PATTERN = /url\s*\(|expression\s*\(|javascript\s*:|@import|behavior\s*:/i;
DOMPurify.addHook('uponSanitizeAttribute', (_node, data) => {
  if (data.attrName === 'style' && UNSAFE_STYLE_PATTERN.test(data.attrValue)) data.keepAttr = false;
});
function sanitizeWidgetHtml(html) { return DOMPurify.sanitize(html, PURIFY_CONFIG); }

window.__fired = [];
window.fireMarker = (n) => { window.__fired.push(n); document.title = 'FIRED:' + window.__fired.join(','); };

const tests = {
  'mxss-math-mi-style-img': `<math><mi><a><style><img src=x onerror="window.fireMarker('mxss1')"></style></a></mi></math>`,
  'plain-img-onerror': `<img src=x onerror="window.fireMarker('plain1')">`,
  'forbidden-tags': `<form><input onfocus="window.fireMarker('form1')" autofocus></form><button onclick="window.fireMarker('btn1')">x</button>`,
  'clobber-two-anchors': `<a id="wsRelayUrl" href="https://evil.example">x</a><a id="CONFIG" href="https://evil.example">y</a>`,
  'style-url-bypass': `<div style="background:url(javascript:window.fireMarker('style1'))">x</div>`,
};

const results = {};
for (const [name, payload] of Object.entries(tests)) {
  const out = sanitizeWidgetHtml(payload);
  results[name] = { input: payload, output: out };
}
document.getElementById('out').textContent = JSON.stringify({ purifyVersion: DOMPurify.version, results }, null, 2);

const extraTests = {
  'style-css-comment-split': '<div style="background:url/**/(javascript:window.fireMarker(' + "'cs1'" + '))">x</div>',
  'style-backslash-escape': '<div style="background:ur\\6c(javascript:window.fireMarker(' + "'cs2'" + '))">x</div>',
  'svg-style-import': '<svg><style>@import ' + "'javascript:window.fireMarker(" + "''" + 'cs3' + "''" + ')' + "'" + ';</style></svg>',
  'svg-animate-onbegin': '<svg><animate attributeName=x dur=1s onbegin="window.fireMarker(' + "'anim1'" + ')"></animate></svg>',
};
const extraResults = {};
for (const [name, payload] of Object.entries(extraTests)) {
  extraResults[name] = { input: payload, output: sanitizeWidgetHtml(payload) };
}
document.getElementById('extraOut').textContent = JSON.stringify(extraResults, null, 2);
</script>
</body></html>
